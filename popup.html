<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>eBay Seller Feedback Filter</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 280px; margin: 0; padding: 14px 16px;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    h1 { font-size: 14px; margin: 0 0 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; gap: 10px; }
    .row label { flex: 1; }
    input[type="number"] { width: 84px; padding: 5px 6px; box-sizing: border-box; text-align: right; }
    input[type="checkbox"] { width: 16px; height: 16px; }
    .hint { color: #888; font-size: 11px; margin: 2px 0 0; }
    hr { border: none; border-top: 1px solid rgba(128,128,128,.3); margin: 12px 0; }
    #stats { font-weight: 600; }
    #stats .n { color: #d93025; }
  </style>
</head>
<body>
  <h1>Seller Feedback Filter</h1>

  <div class="row">
    <label for="enabled">Enabled</label>
    <input type="checkbox" id="enabled" />
  </div>

  <div class="row">
    <label for="minPercent">Min positive rating %</label>
    <input type="number" id="minPercent" min="0" max="100" step="0.1" />
  </div>

  <div class="row">
    <label for="minFeedback">Min feedback count</label>
    <input type="number" id="minFeedback" min="0" step="1" />
  </div>

  <div class="row">
    <label for="hideUnknown">Hide listings with no seller rating</label>
    <input type="checkbox" id="hideUnknown" />
  </div>

  <hr />
  <div id="stats">On this page: <span class="n" id="hidden">–</span> hidden of <span id="total">–</span></div>
  <p class="hint">Click the 🛡️ badge on the page to peek at what was filtered.</p>

  <script src="popup.js"></script>
</body>
</html>
